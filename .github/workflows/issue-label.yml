name: Apply labels to new issues
on:
    issues:
        types: [opened]

permissions:
    issues: write

jobs:
    label-issue:
        runs-on: ubuntu-latest
        steps:
            - name: Apply version/type labels
              uses: actions/github-script@v6
              with:
                  script: |
                      const issue = context.payload.issue;
                      const fields = issue.body.match(/```?yaml([\s\S]*?)```?/);
                      let version = 'v1.0.0';
                      let type = 'feature';

                      // Parse issue body from GitHub form (simple regex for YAML-like fields)
                      const versionMatch = issue.body.match(/version:\s*(v[0-9]+\.[0-9]+\.[0-9]+)/i);
                      if (versionMatch) version = versionMatch[1].trim();

                      const typeMatch = issue.body.match(/type:\s*([a-z]+)/i);
                      if (typeMatch) type = typeMatch[1].trim();

                      // Apply labels
                      await github.rest.issues.addLabels({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: issue.number,
                        labels: [version, type]
                      });

                      // Suggest branch name in comment
                      const slug = issue.title.toLowerCase()
                        .replace(/[^\w\s-]/g, '')
                        .replace(/\s+/g, '-');
                      const branchName = `release/${version}/${type}/${slug}`;

                      await github.rest.issues.createComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: issue.number,
                        body: `Suggested branch name: \`${branchName}\``
                      });
