name: Issue Assignment
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  assign-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Assign issue to author if requested
        uses: actions/github-script@v6
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';

            // Check if this is from the issue template
            if (!body.includes('### Branch Creation') && !body.includes('### Assignment')) {
              console.log('Not from the issue template, skipping');
              return;
            }

            // Check if "Assign to me directly" checkbox is checked
            const assignToAuthor = /- \[x\]\s*Assign to me directly/i.test(body);
            const username = issue.user.login;

            if (assignToAuthor) {
              // Add the issue author as an assignee (idempotent)
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                assignees: [username]
              });
              console.log(`✅ Assigned issue to @${username}`);
            } else {
              // Checkbox not checked: if the issue author is currently an assignee, remove them.
              const currentAssignees = (issue.assignees || []).map(a => a.login);
              if (currentAssignees.includes(username)) {
                await github.rest.issues.removeAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  assignees: [username]
                });
                console.log(`✅ Removed @${username} from assignees`);
              } else {
                console.log('Author is not an assignee; nothing to do');
              }
            }
