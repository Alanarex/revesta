name: Issue Labels
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  apply-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Parse issue and apply labels
        uses: actions/github-script@v6
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';

            // Check if this is from the issue template
            if (!body.includes('### Branch Creation') && !body.includes('### Assignment')) {
              console.log('Not from the issue template, skipping');
              return;
            }

            // Parse issue type: look for known issue type keywords (robust against different rendering)
            const allowedTypes = ['feature','bug','chore','docs','enhancement','refactor','test','perf','security'];
            let issueType = 'feature';
            const typeRegex = new RegExp('\\b(' + allowedTypes.join('|') + ')\\b', 'i');
            const typeMatch = body.match(typeRegex);
            if (typeMatch) {
              issueType = typeMatch[1].toLowerCase();
            }

            // If parsed value isn't one of the allowed types, ignore it and fall back to default
            if (!allowedTypes.includes(issueType)) {
              console.log(`Parsed issueType \"${issueType}\" is not a known type; falling back to 'feature'`);
              issueType = 'feature';
            }

            // Parse version
            let version = 'v1.0.0';
            const versionPatterns = [
              /### Target Version\s*\n.*?\n\n(v\d+\.\d+\.\d+)/i,
              /`(v\d+\.\d+\.\d+)`/i,
              /\b(v\d+\.\d+\.\d+)\b/i
            ];
            for (const pattern of versionPatterns) {
              const match = body.match(pattern);
              if (match) {
                version = match[1];
                break;
              }
            }

            // Create type label if it doesn't exist - red color
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: issueType
              });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: issueType,
                  color: 'FF0000',
                  description: `${issueType.charAt(0).toUpperCase() + issueType.slice(1)} issue type`
                });
                console.log(`✅ Created type label: ${issueType}`);
              }
            }

            // Create version label if it doesn't exist - blue color
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: version
              });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: version,
                  color: '0000FF',
                  description: `Version ${version}`
                });
                console.log(`✅ Created version label: ${version}`);
              }
            }

            // Sanitize issueType into a label
            const sanitizedType = issueType.toLowerCase().replace(/[^\w\s-]/g, '').replace(/\s+/g, '-').substring(0, 50);

            // Replace all labels on the issue with exactly the managed labels (sanitizedType and version)
            // This will remove any other labels and set only the type and version labels as requested.
            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: [sanitizedType, version]
            });

            console.log(`✅ Replaced labels with: ${sanitizedType}, ${version}`);
