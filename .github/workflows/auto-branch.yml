name: Auto create branch from issue labels

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  create-branch:
    if: >
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'release:v') &&
      (
        contains(github.event.issue.labels.*.name, 'type:feature') ||
        contains(github.event.issue.labels.*.name, 'type:fix') ||
        contains(github.event.issue.labels.*.name, 'type:refactor') ||
        contains(github.event.issue.labels.*.name, 'type:hotfix') ||
        contains(github.event.issue.labels.*.name, 'type:chore')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Derive release/type/slug
        id: derive
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(l => l.name);
            const rel = labels.find(l => l.startsWith('release:v'));
            const type = labels.find(l => l.startsWith('type:')).split(':')[1];
            const title = context.payload.issue.title
              .toLowerCase()
              .replace(/[^a-z0-9]+/g,'-')
              .replace(/(^-|-$)/g,'');
            const issueNum = context.payload.issue.number;
            const release = rel.replace('release:',''); // → v1.0.1
            const branch = `release/${release}/${type}/${issueNum}-${title}`;
            core.setOutput('branch', branch);
            core.setOutput('release', release);

      - name: Get base SHA (release main)
        id: base
        uses: actions/github-script@v7
        with:
          script: |
            const release = core.getOutput('release');
            const baseRef = `heads/release/${release}/main`;
            try {
              const { data } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: baseRef
              });
              core.setOutput('sha', data.object.sha);
            } catch (e) {
              const repo = await github.rest.repos.get(context.repo);
              const def = `heads/${repo.data.default_branch}`;
              const { data } = await github.rest.git.getRef({
                owner: context.repo.owner, repo: context.repo.repo, ref: def
              });
              core.setOutput('sha', data.object.sha);
            }

      - name: Create branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = core.getOutput('branch');
            const sha = core.getOutput('sha');
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/heads/${branch}`,
              sha
            });

      - name: Comment on issue with link
        uses: actions/github-script@v7
        with:
          script: |
            const branch = core.getOutput('branch');
            const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/tree/${branch}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `Branch created: \`${branch}\`\n\n${url}`
            });
